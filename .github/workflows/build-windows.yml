name: Build portable Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  build-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (Windows)
        run: npm test
      - name: Electron smoke test (window boots on CI desktop session)
        shell: pwsh
        run: |
          $env:TRS_SMOKE='1'
          # --no-sandbox ditambahkan eksplisit agar langkah smoke deterministik di runner;
          # pada pemakaian normal di Windows aplikasi berjalan tanpa flag ini.
          npx electron . --no-sandbox 2>&1 | Tee-Object -FilePath smoke.log
          $code = $LASTEXITCODE
          Get-Content smoke.log
          if ($code -ne 0) { exit $code }
          if (-not ((Get-Content smoke.log -Raw) -match 'TRS_SMOKE_OK')) { exit 1 }
      - name: Build portable exe
        run: npm run dist:win
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThermalReceiptStudio-portable-win-x64
          path: dist/*.exe
          if-no-files-found: error
