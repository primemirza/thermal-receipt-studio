name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Node 22 memenuhi engine requirement Electron 44 dan toolchain terkait.
        node: ['22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
  electron-smoke-ubuntu:
    # Wajib memunculkan marker TRS_SMOKE_OK pada stdout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Electron smoke (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64
          Xvfb :99 &
          export DISPLAY=:99
          TRS_SMOKE=1 npx electron . --no-sandbox > smoke.log 2>&1; code=$?
          cat smoke.log
          if [ $code -ne 0 ]; then exit $code; fi
          grep -q "TRS_SMOKE_OK" smoke.log || { echo "SMOKE MARKER MISSING"; exit 1; }
